<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Stremio</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      #open {
        width: 100%;
        height: 100%;
        border: 0;
        background: #111;
        color: white;
        font-size: 36px;
      }
    </style>
  </head>
  <body>
    <button id="open">Open Stremio</button>

    <script>
      document.getElementById("open").onclick = function () {
        window.location.href = "https://web.stremio.com/";
      };

      setTimeout(function () {
        window.location.href = "https://web.stremio.com/";
      }, 1000);
    </script>
  </body>
</html>
